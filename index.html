<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="author" content="Bryan Falkowski">
<title>Building58</title>
<script src="shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --fg: #2c2c2c; --muted: #666666; --line: #e0e0e0; --accent: #1d3f72;
    --sans: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif; --mono: "Roboto Mono", ui-monospace, monospace; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141619; --fg: #e6e6e6; --muted: #a0a4aa; --line: #2c3036; --accent: #8fb0e3; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #141619; --fg: #e6e6e6; --muted: #a0a4aa; --line: #2c3036; --accent: #8fb0e3; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--sans); padding: 0 16px; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 0 64px; }
  h1 { font-size: 32px; font-weight: 600; line-height: 1.2; margin: 0 0 6px; }
  p { margin: 0 0 24px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.world { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
  a.world:hover, a.world:focus-visible { border-color: var(--accent); outline: none; }
  a.world strong { display: block; font-size: 20px; font-weight: 600; color: var(--accent); }
  code { font: 14px var(--mono); }
</style>
</head>
<body>
<main>
  <h1>Building58</h1>
  <p>Small 3D worlds you can drive from code. Each one has the same <code>window.run</code> API, so the relay works with all of them.</p>
  <ul>
    <li><a class="world" href="office/"><strong>Room</strong>A loft in New York. Each developer is a skill of a coding agent. When the agent uses a skill, that developer goes to work.</a></li>
  </ul>
</main>
</body>
</html>
