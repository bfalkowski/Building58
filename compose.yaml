# One Building58 room. Fill in .env from .env.example, then: docker compose up -d
# Open http://localhost:8787/office/?channel=office&key=<your RELAY_KEY>
# See docs/manual/running.html#container.
services:
  room:
    # The published image, made and tested by .github/workflows/release.yml. To build it from this
    # folder instead: docker compose up -d --build. BUILDING58_VERSION picks a release, such as 0.7.0.
    image: ghcr.io/bfalkowski/building58:${BUILDING58_VERSION:-latest}
    build: .
    env_file: .env
    environment:
      PORT: ${ROOM_PORT:-8787}
      RELAY_IN_CONTAINER: "1"
    # Only this computer: the room page can run any command in the container.
    ports:
      - "127.0.0.1:${ROOM_PORT:-8787}:8800"
    restart: unless-stopped
    cpus: ${ROOM_CPUS:-4}
    mem_limit: ${ROOM_MEMORY:-8g}
    volumes:
      - building58:/home/node/building58
      - state:/home/node/.office-world
      - claude:/home/node/.claude
      - repos:/home/node/repos

volumes:
  building58:
  state:
  claude:
  repos:
